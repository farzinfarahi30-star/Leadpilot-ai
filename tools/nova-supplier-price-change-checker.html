<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Supplier Price Change Checker</title>
<style>body{font-family:system-ui,sans-serif;max-width:980px;margin:auto;padding:24px;line-height:1.45}fieldset{margin:14px 0;padding:16px}label{display:block;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}input,select,button{font:inherit;padding:8px}button{cursor:pointer}.muted{color:#666}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;margin-top:16px}th,td{border:1px solid #ddd;padding:6px;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#fff}.pill{display:inline-block;border:1px solid #bbb;border-radius:999px;padding:2px 8px;margin:2px}.summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
</head><body>
<h1>Nova Supplier Price Change Checker</h1>
<p class="muted">Compare two CSV supplier price lists locally in your browser. Files stay on this device; nothing is uploaded.</p>
<div class="grid"><fieldset><legend>Old price list</legend><input id="oldFile" type="file" accept=".csv,text/csv"></fieldset><fieldset><legend>New price list</legend><input id="newFile" type="file" accept=".csv,text/csv"></fieldset></div>
<fieldset><legend>Columns</legend><div class="grid"><label>Product key / SKU<select id="keyCol"></select></label><label>Price column<select id="priceCol"></select></label></div><label><input type="checkbox" id="ignoreCase" checked> Match product keys case-insensitively</label><button id="compare">Compare lists</button> <button id="download" disabled>Download report CSV</button></fieldset>
<div id="status" class="muted">Load both CSV files to begin.</div><div id="summary" class="summary"></div><div class="tablewrap"><table id="table" hidden><thead><tr><th>Status</th><th>Key</th><th>Old price</th><th>New price</th><th>Change</th><th>%</th></tr></thead><tbody></tbody></table></div>
<p><a href="https://buy.stripe.com/00w14n5ru7yu0Qr3tT9Zm0P">Buy the Solo Business package — £12</a></p>
<script>
const $=id=>document.getElementById(id); let oldData=null,newData=null,report=[];
function parseCSV(text){let rows=[],row=[],field='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(q){if(c==='"'&&n==='"'){field+='"';i++;}else if(c==='"')q=false;else field+=c;}else{if(c==='"')q=true;else if(c===','){row.push(field);field='';}else if(c=='\n'){row.push(field);rows.push(row);row=[];field='';}else if(c!=='\r')field+=c;}}row.push(field);if(row.some(x=>x!==''))rows.push(row);if(!rows.length)return {headers:[],rows:[]};const headers=rows[0].map(x=>x.trim());return {headers,rows:rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))};}
function readFile(input,cb){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(parseCSV(r.result));r.readAsText(f);}
function syncCols(){if(!oldData||!newData)return;const common=oldData.headers.filter(h=>newData.headers.includes(h));['keyCol','priceCol'].forEach(id=>{$(id).innerHTML=common.map(h=>`<option>${escapeHtml(h)}</option>`).join('')});const keyGuess=common.find(h=>/(sku|code|id|item|product.*code|reference)/i.test(h));const priceGuess=common.find(h=>/(price|cost|net|rrp|amount)/i.test(h));if(keyGuess)$('keyCol').value=keyGuess;if(priceGuess)$('priceCol').value=priceGuess;$('status').textContent=`Loaded ${oldData.rows.length} old rows and ${newData.rows.length} new rows. Select columns and compare.`;}
$('oldFile').onchange=()=>readFile($('oldFile'),d=>{oldData=d;syncCols()});$('newFile').onchange=()=>readFile($('newFile'),d=>{newData=d;syncCols()});
function norm(v){v=(v??'').trim();return $('ignoreCase').checked?v.toLowerCase():v}function num(v){let s=(v??'').trim().replace(/[^0-9,.-]/g,'');if(!s)return NaN;if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');else s=s.replace(/,/g,'');return Number(s)}function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('compare').onclick=()=>{if(!oldData||!newData){$('status').textContent='Load both files first.';return;}const k=$('keyCol').value,p=$('priceCol').value;if(!k||!p)return;const make=(rows)=>{const m=new Map(),dupes=[];rows.forEach((r,i)=>{const key=norm(r[k]);if(!key)return;if(m.has(key))dupes.push(key);else m.set(key,{row:r,index:i+2});});return {m,dupes}};const a=make(oldData.rows),b=make(newData.rows);const keys=new Set([...a.m.keys(),...b.m.keys()]);report=[];for(const key of keys){const A=a.m.get(key),B=b.m.get(key);if(!A){report.push({status:'NEW',key,old:'',new:B.row[p],change:'',pct:''});continue}if(!B){report.push({status:'REMOVED',key,old:A.row[p],new:'',change:'',pct:''});continue}const x=num(A.row[p]),y=num(B.row[p]);if(Number.isFinite(x)&&Number.isFinite(y)&&x!==y){const d=y-x,pc=x===0?'':(d/x*100);report.push({status:d>0?'INCREASE':'DECREASE',key,old:A.row[p],new:B.row[p],change:d.toFixed(2),pct:pc===''?'':pc.toFixed(2)+'%'});}else if(!Number.isFinite(x)||!Number.isFinite(y)){if((A.row[p]??'').trim()!==(B.row[p]??'').trim())report.push({status:'PRICE TEXT CHANGED',key,old:A.row[p],new:B.row[p],change:'',pct:''});}}
const counts=Object.fromEntries(['NEW','REMOVED','INCREASE','DECREASE','PRICE TEXT CHANGED'].map(s=>[s,report.filter(r=>r.status===s).length]));$('summary').innerHTML=Object.entries(counts).map(([k,v])=>`<span class="pill">${k}: ${v}</span>`).join('')+`<span class="pill">Old duplicate keys: ${a.dupes.length}</span><span class="pill">New duplicate keys: ${b.dupes.length}</span>`;$('status').textContent=`Compared ${keys.size} unique product keys. Review flagged rows before updating any system.`;const tb=$('table').querySelector('tbody');tb.innerHTML=report.map(r=>`<tr><td>${escapeHtml(r.status)}</td><td>${escapeHtml(r.key)}</td><td>${escapeHtml(r.old)}</td><td>${escapeHtml(r.new)}</td><td>${escapeHtml(r.change)}</td><td>${escapeHtml(r.pct)}</td></tr>`).join('');$('table').hidden=false;$('download').disabled=false;};
$('download').onclick=()=>{const lines=[['status','key','old_price','new_price','change','percent'],...report.map(r=>[r.status,r.key,r.old,r.new,r.change,r.pct])].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines],{type:'text/csv'}));a.download='nova_price_change_report.csv';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
