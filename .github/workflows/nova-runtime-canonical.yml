name: Nova Runtime Canonical

on:
  push:
    paths:
      - 'nova-runtime/package.json'
      - 'nova-runtime/src/**'
      - 'nova-mail/package.json'
      - 'nova-mail/src/**'
      - '.github/workflows/nova-runtime-canonical.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: nova-runtime-canonical
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RUN_MINUTES: ${{ github.event_name == 'push' && '5' || '50' }}
      POLL_MS: 600000
      NOVA_MAIL_PROVIDER: ${{ secrets.NOVA_MAIL_PROVIDER }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      GMAIL_ACCOUNT: ${{ secrets.GMAIL_ACCOUNT }}
      GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
      GMAIL_ACCESS_TOKEN: ${{ secrets.GMAIL_ACCESS_TOKEN }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      OUTLOOK_ACCESS_TOKEN: ${{ secrets.OUTLOOK_ACCESS_TOKEN }}
      OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
      OUTLOOK_CLIENT_SECRET: ${{ secrets.OUTLOOK_CLIENT_SECRET }}
      OUTLOOK_REFRESH_TOKEN: ${{ secrets.OUTLOOK_REFRESH_TOKEN }}
      NOVA_MAIL_TEST_TO: ${{ secrets.NOVA_TEST_EMAIL }}
      NOVA_MAIL_TEST_FROM: ${{ secrets.NOVA_MAIL_TEST_FROM }}
      NOVA_MAIL_TEST_APPROVED: ${{ secrets.NOVA_MAIL_TEST_APPROVED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nova-runtime/package.json

      - name: Install runtime
        working-directory: nova-runtime
        run: npm install --omit=dev

      - name: Install Nova Mail
        working-directory: nova-mail
        run: npm install --omit=dev

      - name: Validate Nova Mail
        working-directory: nova-mail
        run: |
          node --check src/core.mjs
          node --check src/mcp-server.mjs
          node --check src/smoke.mjs
          npm run smoke

      - name: Install Chromium
        working-directory: nova-runtime
        run: npx playwright install --with-deps chromium

      - name: Validate runtime syntax
        working-directory: nova-runtime
        run: |
          node --check src/worker.mjs
          node --check src/agent-runtime.mjs
          node --check src/smoke.mjs

      - name: Run Nova Runtime
        working-directory: nova-runtime
        run: npm start
