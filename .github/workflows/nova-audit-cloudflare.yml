name: Deploy Nova Website Audit API to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "nova-audit-worker/worker.mjs"
      - "nova-audit-worker/wrangler.jsonc"
      - "nova-audit-worker/README.md"
      - ".github/workflows/nova-audit-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-audit-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Deploy Worker and verify public API
        working-directory: nova-audit-worker
        shell: bash
        run: |
          set -o pipefail
          url="https://nova-website-audit-api.azinahi123.workers.dev"

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            printf '%s\n' '{"success":false,"reason":"cloudflare_secrets_missing"}' > DEPLOYMENT-PROOF.json
            exit 0
          fi

          npm install --global wrangler@latest
          wrangler whoami
          wrangler deploy 2>&1 | tee /tmp/nova-audit-deploy.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            printf '%s\n' '{"success":false,"reason":"wrangler_deploy_failed"}' > DEPLOYMENT-PROOF.json
            exit 0
          fi

          health=$(curl --fail --silent --show-error --retry 8 --retry-delay 2 "$url/health" || true)
          audit=$(curl --fail --silent --show-error --retry 4 --retry-delay 2 -H 'content-type: application/json' --data '{"url":"https://example.com"}' "$url/api/audit/rapid" || true)

          if printf '%s' "$health" | jq -e '.ok == true' >/dev/null 2>&1 && printf '%s' "$audit" | jq -e '.ok == true and .http.status == 200' >/dev/null 2>&1; then
            version=$(printf '%s' "$health" | jq -r '.version // "unknown"')
            jq -n --arg url "$url" --arg version "$version" --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{success:true,url:$url,verifiedAt:$verifiedAt,healthVerified:true,auditVerified:true,version:$version}' > DEPLOYMENT-PROOF.json
          else
            jq -n --arg url "$url" --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{success:false,url:$url,verifiedAt:$verifiedAt,reason:"live_verification_failed"}' > DEPLOYMENT-PROOF.json
          fi

          cat DEPLOYMENT-PROOF.json

      - name: Publish deployment proof
        shell: bash
        run: |
          git config user.name "nova-audit-deployer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nova-audit-worker/DEPLOYMENT-PROOF.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Nova Website Audit API deployment proof"
          git push
