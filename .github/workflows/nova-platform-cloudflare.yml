name: Deploy Nova Platform to Cloudflare Workers

on:
  push:
    paths:
      - "nova-platform/worker.mjs"
      - "nova-platform/wrangler.jsonc"
      - "nova-platform/public/**"
      - ".github/workflows/nova-platform-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy when Cloudflare authority is present
        working-directory: nova-platform
        shell: bash
        run: |
          set +e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            printf '%s\n' '{"success":false,"reason":"CLOUDFLARE_API_TOKEN missing","independentOfHatchable":true,"independentOfAppDeploy":true}' > DEPLOYMENT-PROOF.json
            exit 0
          fi
          npm install --global wrangler@latest
          wrangler whoami
          wrangler deploy --dry-run
          wrangler deploy 2>&1 | tee /tmp/nova-deploy.log
          status=${PIPESTATUS[0]}
          url=$(grep -Eo 'https://[^[:space:]]+workers\\.dev[^[:space:]]*' /tmp/nova-deploy.log | tail -1)
          if [ "$status" -eq 0 ] && [ -n "$url" ]; then
            if curl --fail --silent --show-error --retry 5 --retry-delay 2 "$url/api/health" > /tmp/health.json; then
              python - <<'PY'
import json
x=json.load(open('/tmp/health.json'))
assert x.get('ok') is True
assert x.get('vendor_lock_in') is False
assert x.get('stateful') is True
print('LIVE_HEALTH_OK')
PY
              if [ "$?" -eq 0 ]; then
                python - "$url" <<'PY'
import json,sys
from datetime import datetime,timezone
url=sys.argv[1]
print(json.dumps({'success':True,'verifiedAt':datetime.now(timezone.utc).isoformat(),'url':url,'independentOfHatchable':True,'independentOfAppDeploy':True,'healthVerified':True},indent=2))
json.dump({'success':True,'verifiedAt':datetime.now(timezone.utc).isoformat(),'url':url,'independentOfHatchable':True,'independentOfAppDeploy':True,'healthVerified':True},open('DEPLOYMENT-PROOF.json','w'),indent=2)
PY
              else
                printf '%s\n' '{"success":false,"reason":"live_health_check_failed","independentOfHatchable":true,"independentOfAppDeploy":true}' > DEPLOYMENT-PROOF.json
              fi
            else
              printf '%s\n' '{"success":false,"reason":"deployment_failed_or_health_unreachable","independentOfHatchable":true,"independentOfAppDeploy":true}' > DEPLOYMENT-PROOF.json
            fi
          else
            printf '%s\n' '{"success":false,"reason":"deployment_failed","independentOfHatchable":true,"independentOfAppDeploy":true}' > DEPLOYMENT-PROOF.json
          fi
          exit 0
      - name: Publish deployment proof
        working-directory: .
        shell: bash
        run: |
          git config user.name "nova-platform-deployer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nova-platform/DEPLOYMENT-PROOF.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Nova Platform deployment proof"
          git push
