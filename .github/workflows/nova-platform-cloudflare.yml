name: Deploy Nova Platform to Cloudflare Workers

on:
  push:
    paths:
      - "nova-platform/**"
      - ".github/workflows/nova-platform-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check Cloudflare credentials are available
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN missing"; exit 20; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID missing"; exit 21; }
          echo "CLOUDFLARE_CREDENTIALS_PRESENT=true"
      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Validate Wrangler identity
        run: wrangler whoami
      - name: Validate Worker configuration
        working-directory: nova-platform
        run: wrangler deploy --dry-run
      - name: Deploy Nova Platform
        working-directory: nova-platform
        run: wrangler deploy
