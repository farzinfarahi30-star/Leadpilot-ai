name: Nova Production Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  SOURCE_RUN: "35419874771"
  TAG: "nova-production-35419874771"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download and stage verified Nova production artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "10576926873"
        run: |
          set -euo pipefail
          rm -rf nova-production
          mkdir -p nova-production
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/nova-artifact.zip
          unzip -q /tmp/nova-artifact.zip -d nova-production
          FINAL_PATH="$(find nova-production -type f -name 'final.pt' | head -1)"
          MANIFEST_PATH="$(find nova-production -type f -name 'final_manifest.json' | head -1)"
          VERIFY_PATH="$(find nova-production -type f -name 'verification.json' | head -1)"
          test -n "$FINAL_PATH"
          test -n "$MANIFEST_PATH"
          test -n "$VERIFY_PATH"
          cp "$FINAL_PATH" nova-final.pt
          cp "$MANIFEST_PATH" nova-final_manifest.json
          cp "$VERIFY_PATH" nova-verification.json
          test -s nova-final.pt
          test -s nova-final_manifest.json
          test -s nova-verification.json
          sha256sum nova-final.pt nova-final_manifest.json nova-verification.json
          echo "NOVA_RELEASE_INPUTS_READY"
      - name: Validate release payload
        run: |
          set -euo pipefail
          test -s nova-production/production/final.pt
          test -s nova-production/production/final_manifest.json
          test -s nova-production/production/verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("nova-production/production/final_manifest.json").read_text())
          v=json.loads(Path("nova-production/production/verification.json").read_text())
          assert m.get("tokens_seen")==50000000
          assert m.get("parameters")==46239984
          assert v.get("status")=="passed"
          print("RELEASE_PAYLOAD_OK")
          PY

      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 ||             gh release create "$TAG"               --title "Nova AI Production 50M"               --notes "Verified Nova production checkpoint from recovery run $SOURCE_RUN."               --target main
          gh release upload "$TAG" nova-final.pt nova-final_manifest.json nova-verification.json --clobber
          echo "RELEASE_OK"
