name: Nova Queue Cleanup

on:
  push:
    branches: [nova-production]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Cancel stale branch runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          latest_nova=$(gh run list --repo "${{ github.repository }}" --workflow ".github/workflows/nova-production.yml" --branch nova-production --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          gh run list --repo "${{ github.repository }}" --branch nova-production --limit 100 --json databaseId,name,status --jq '.[] | select(.status == "queued" or .status == "in_progress") | [.databaseId,.name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            [ -z "$id" ] && continue
            case "$name" in
              "Nova Production")
                [ "$id" = "$latest_nova" ] && continue
                gh run cancel "$id" --repo "${{ github.repository }}" || true
                ;;
              "CodeQuest Kids Open Free Submissions"|"CodeQuest Kids Directory Submission Runner"|"CodeQuest Kids Fast Outbound Check")
                gh run cancel "$id" || true
                ;;
            esac
          done
