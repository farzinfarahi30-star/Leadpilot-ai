name: KodoNest Junior Android Release

on:
  push:
    branches:
      - kodonest-junior-fresh-20260918
  workflow_dispatch:

env:
  EXPECTED_PACKAGE: com.kodonest.junior
  EXPECTED_VERSION: 1.0.0
  EXPECTED_VERSION_CODE: "1"
  CANONICAL_APK: KodoNest-Junior-1.0.0-UPTODOWN-VERIFIED.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Generate isolated signing key
        run: |
          set -euo pipefail
          mkdir -p CodeQuestKidsBuild/keys
          PW="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          keytool -genkeypair -v \
            -keystore CodeQuestKidsBuild/keys/kodonest-junior-release.jks \
            -storetype JKS -storepass "$PW" -keypass "$PW" \
            -alias kodonestjunior -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=KodoNest Junior, OU=KodoNest Junior, O=KodoNest Junior, L=Remote, ST=Global, C=US"
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/CodeQuestKidsBuild/keys/kodonest-junior-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=kodonestjunior" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Build clean release
        working-directory: CodeQuestKidsBuild
        run: gradle --no-daemon clean assembleRelease

      - name: Canonicalize and validate
        run: |
          set -euo pipefail
          SRC=CodeQuestKidsBuild/app/build/outputs/apk/release/app-release.apk
          OUT="CodeQuestKidsBuild/$CANONICAL_APK"
          test -s "$SRC"
          cp "$SRC" "$OUT"
          python3 CodeQuestKidsBuild/scripts/verify_kodonest_apk.py "$OUT"
          sha256sum "$OUT" | tee CodeQuestKidsBuild/SHA256.txt
          printf '%s\n' "$CANONICAL_APK" > CodeQuestKidsBuild/UPLOAD_THIS_APK.txt

      - name: Ensure one APK
        run: |
          test "$(find CodeQuestKidsBuild -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: KodoNest-Junior-1.0.0-Uptodown
          path: |
            CodeQuestKidsBuild/${{ env.CANONICAL_APK }}
            CodeQuestKidsBuild/SHA256.txt
            CodeQuestKidsBuild/UPLOAD_THIS_APK.txt
          if-no-files-found: error
          retention-days: 30
