name: Nova External XX Runtime

on:
  push:
    paths:
      - 'nova-runtime/src/**'
      - 'nova-runtime/company-takeover-manifest.json'
      - '.github/workflows/nova-external-xx-runtime.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: nova-external-xx-runtime
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  execute:
    if: !contains(github.event.head_commit.message || '', 'Record Nova external XX live proof')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: 'https://sidemarket.io/project/callbooker'
      FACTORY_URL: 'https://ai-business-factory.hatchable.site'
      GITHUB_TOKEN: ${{ github.token }}
      NOVA_TAKEOVER_ONLY: 'false'
      RUN_MINUTES: '1'
      NOVA_DEVICE_CONTROL: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nova-runtime/package.json

      - name: Install Nova runtime
        working-directory: nova-runtime
        run: npm install --omit=dev

      - name: Install Chromium
        working-directory: nova-runtime
        run: npx playwright install --with-deps chromium

      - name: Validate takeover manifest
        working-directory: nova-runtime
        run: node test/company-takeover.test.mjs

      - name: Execute real Nova external runtime
        working-directory: nova-runtime
        shell: bash
        run: |
          set -o pipefail
          node src/xx-runner.mjs | tee ../nova-external-runtime.log

      - name: Verify live target and write proof
        working-directory: nova-runtime
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
          FACTORY_URL: ${{ env.FACTORY_URL }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const log = fs.readFileSync('../nova-external-runtime.log','utf8')
            .trim().split('\n').filter(Boolean).map(line => JSON.parse(line));
          const completion = log.find(x => x.event === 'xx_takeover_complete');
          if (!completion) throw new Error('Nova external runtime did not emit xx_takeover_complete');
          if (!completion.companyTakeover?.validation?.ok) throw new Error('Takeover manifest validation failed at runtime');

          async function probe(url) {
            const started = Date.now();
            try {
              const r = await fetch(url, {redirect:'follow', headers:{'user-agent':'Nova-External-Runtime/1.0'}});
              const body = await r.text();
              return {url,status:r.status,ok:r.ok,latencyMs:Date.now()-started,bodyBytes:Buffer.byteLength(body),sample:body.replace(/\s+/g,' ').slice(0,280)};
            } catch (e) {
              return {url,status:null,ok:false,latencyMs:Date.now()-started,error:String(e)};
            }
          }

          const target = await probe(process.env.TARGET_URL);
          const factory = await probe(process.env.FACTORY_URL);
          if (!target.ok) throw new Error('Live XX source target was not reachable: HTTP '+target.status);

          const proof = {
            schema:'nova.external.xx.live-proof.v1',
            verifiedAt:new Date().toISOString(),
            success:true,
            executor:'GitHub-hosted Nova Runtime',
            independentOfHatchableFunctionRuntime:true,
            control:completion.control,
            mode:completion.mode,
            target:{
              name:'CallBooker',
              sourceUrl:process.env.TARGET_URL,
              liveSourceCheck:target
            },
            novaRuntime:{
              companyTakeover:completion.companyTakeover,
              cycle:completion.cycle ?? null,
              completed:completion.completed ?? null,
              failed:completion.failed ?? null,
              browser:completion.browser ?? null
            },
            factoryObservation:{
              url:process.env.FACTORY_URL,
              check:factory,
              note: factory.status===429 ? 'Hatchable function/runtime quota is still the external blocker; the Nova execution lane itself completed outside Hatchable.' : 'Factory endpoint reachable from external runtime.'
            },
            evidencePolicy:'Only observed runtime and live HTTP/browser evidence is recorded; no synthetic customers, revenue, or success metrics are fabricated.'
          };

          fs.writeFileSync('EXTERNAL-XX-LIVE-PROOF.json',JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify({
            success:true,
            targetStatus:target.status,
            factoryStatus:factory.status,
            runtimeCompleted:completion.completed ?? null,
            runtimeFailed:completion.failed ?? null
          },null,2));
          NODE

      - name: Record immutable proof artifact
        run: |
          git config user.name 'nova-external-runtime'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nova-runtime/EXTERNAL-XX-LIVE-PROOF.json
          git commit -m 'Record Nova external XX live proof'
          git push
