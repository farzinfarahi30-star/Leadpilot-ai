name: CodeQuest Kids Android Build

on:
  push:
    branches: [codequest-kids-android-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codequest-kids-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK and AAB
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Package release outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/CodeQuest-Kids-1.2.0-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/CodeQuest-Kids-1.2.0-release-unsigned.aab
          sha256sum dist/* | tee dist/SHA256SUMS.txt
      - name: Upload release outputs
        uses: actions/upload-artifact@v4
        with:
          name: CodeQuest-Kids-Android-Release-Unsigned
          path: codequest-kids-android/dist/*
          retention-days: 30
