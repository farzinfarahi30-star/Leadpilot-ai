name: CodeQuest Kids Android Build

on:
  push:
    branches: [codequest-kids-android-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codequest-kids-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Align release APK
        run: |
          mkdir -p dist
          zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/CodeQuest-Kids-1.2.0-release-aligned-unsigned.apk
          sha256sum dist/CodeQuest-Kids-1.2.0-release-aligned-unsigned.apk | tee dist/SHA256SUMS.txt
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeQuest-Kids-Android-Release-Aligned-Unsigned
          path: codequest-kids-android/dist/*
          retention-days: 30
      - name: Package Android signing tools
        working-directory: /
        run: |
          tar -C "$ANDROID_HOME/build-tools/36.0.0" -czf /tmp/android-signing-tools-36.0.0.tar.gz apksigner zipalign lib
      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tools-36.0.0
          path: /tmp/android-signing-tools-36.0.0.tar.gz
          retention-days: 30
