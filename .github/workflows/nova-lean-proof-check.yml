name: NOVA Lean Proof Check

on:
  push:
    branches: [main]
    paths:
      - 'research/nova-lean-verification/**'
      - '.github/workflows/nova-lean-proof-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/nova-lean-verification
          test: 'false'
          lint: 'false'
