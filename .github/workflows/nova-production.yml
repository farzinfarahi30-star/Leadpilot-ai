name: Nova Production

on:
  push:
    branches: [nova-production]
  workflow_dispatch:

permissions:
  contents: read

env:
  NOVA_TARGET_TOKENS: "50000000"
  NOVA_CHUNK_TOKENS: "25000000"
  NOVA_RESUME: "1"
  NOVA_ALLOW_SYNTHETIC: "0"
  TORCH_THREADS: "4"

jobs:
  pretrain-1:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nova-production

      - name: Prepare Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1"

      - name: Train first 25M tokens
        run: |
          python nova/run_pipeline.py --stage auto
          cat state/pipeline.json

      - name: Upload first checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: nova-stage-1
          path: |
            state/model_checkpoint.pt
            state/pipeline.json
            corpus/CORPUS_LICENSE.json
            corpus/CORPUS_MANIFEST.json
            corpus/wiki.train.tokens
          if-no-files-found: error
          retention-days: 7

  pretrain-2:
    needs: pretrain-1
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nova-production

      - name: Prepare Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1"

      - name: Download first checkpoint
        uses: actions/download-artifact@v4
        with:
          name: nova-stage-1
          path: .

      - name: Train second 25M tokens
        run: |
          python nova/run_pipeline.py --stage auto
          cat state/pipeline.json

      - name: Upload second checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: nova-stage-2
          path: |
            state/model_checkpoint.pt
            state/pipeline.json
            corpus/CORPUS_LICENSE.json
            corpus/CORPUS_MANIFEST.json
          if-no-files-found: error
          retention-days: 7

  finalize:
    needs: pretrain-2
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nova-production

      - name: Prepare Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1"

      - name: Download second checkpoint
        uses: actions/download-artifact@v4
        with:
          name: nova-stage-2
          path: .

      - name: Download corpus metadata
        uses: actions/download-artifact@v4
        with:
          name: nova-stage-1
          path: .

      - name: Bootstrap corpus
        run: |
          if [ ! -f corpus/wiki.train.tokens ]; then
            python - <<'PY'
          from pathlib import Path
          import urllib.request, zipfile, shutil
          root=Path("corpus"); root.mkdir(parents=True, exist_ok=True)
          arc=Path("state/wikitext.zip"); arc.parent.mkdir(exist_ok=True)
          if not arc.exists():
              urllib.request.urlretrieve(
                  "https://research.metamind.io.s3-us-west-2.amazonaws.com/wikitext/wikitext-103-v1.zip", arc
              )
          with zipfile.ZipFile(arc) as z:
              name=next(n for n in z.namelist() if n.endswith("wiki.train.tokens"))
              with z.open(name) as src, (root/"wiki.train.tokens").open("wb") as dst:
                  shutil.copyfileobj(src, dst, 1024*1024)
          PY
          fi
          test -f corpus/CORPUS_LICENSE.json

      - name: Run SFT DPO evaluation and promotion
        env:
          NOVA_CHUNK_TOKENS: "0"
        run: |
          python nova/run_pipeline.py --stage auto
          cat state/sft.json
          cat state/dpo.json
          cat state/evaluation.json
          cat production/final_manifest.json
          cat production/verification.json

      - name: Publish production artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-production-final
          path: |
            production/final.pt
            production/final_manifest.json
            production/verification.json
            state/evaluation.json
            state/sft.json
            state/dpo.json
            corpus/CORPUS_LICENSE.json
            corpus/CORPUS_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
