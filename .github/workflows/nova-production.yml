name: Nova Production

on:
  push:
    branches: [nova-production]
  workflow_dispatch:
    inputs:
      prev_run_id:
        description: Previous workflow run ID containing the Nova checkpoint artifact
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  nova:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      NOVA_TARGET_TOKENS: "50000000"
      NOVA_CHUNK_TOKENS: "10000000"
      NOVA_RESUME: "1"
      NOVA_ALLOW_SYNTHETIC: "0"
      TORCH_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nova-production

      - name: Prepare Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r nova/requirements.txt

      - name: Restore previous checkpoint
        env:
          PREV_RUN: ${{ inputs.prev_run_id }}
        run: |
          if [ -n "$PREV_RUN" ] && [ "$PREV_RUN" != "0" ]; then
            mkdir -p state
            gh run download "$PREV_RUN" -n nova-checkpoint -D state || true
          fi

      - name: Run Nova pipeline chunk
        id: pipeline
        continue-on-error: true
        run: |
          set +e
          python nova/run_pipeline.py --stage auto | tee nova_run.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload resume checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: nova-checkpoint
          path: |
            state/model_checkpoint.pt
            state/pipeline.json
            state/sft.json
            state/dpo.json
            state/evaluation.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload final production artifacts
        if: hashFiles('production/final.pt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nova-production-final
          path: |
            production/final.pt
            production/final_manifest.json
            production/verification.json
            corpus/CORPUS_LICENSE.json
            corpus/CORPUS_MANIFEST.json
            state/evaluation.json
          if-no-files-found: error
          retention-days: 30

      - name: Continue automatically
        env:
          PREV_RUN_ID: ${{ github.run_id }}
        run: |
          complete=$(python - <<'PY'
          import json, pathlib
          p=pathlib.Path('state/pipeline.json')
          print('1' if p.exists() and json.loads(p.read_text()).get('complete') else '0')
          PY
          )
          if [ "$complete" != "1" ]; then
            gh workflow run nova-production.yml --ref nova-production -f prev_run_id="$PREV_RUN_ID"
          fi

      - name: Summary
        if: always()
        run: |
          echo "Nova pipeline state:"
          cat state/pipeline.json 2>/dev/null || true
          echo
          test -f production/final.pt && echo "PRODUCTION_FINAL_PRESENT=1" || true
