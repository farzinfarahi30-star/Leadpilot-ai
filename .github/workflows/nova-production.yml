concurrency:
  group: nova-production
  cancel-in-progress: true

name: Nova Production

on:
  push:
    branches: [nova-production]
    paths:
      - "nova/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  NOVA_TARGET_TOKENS: "50000000"
  NOVA_ALLOW_SYNTHETIC: "0"
  TORCH_THREADS: "4"

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nova-production

      - name: Prepare corpus tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyarrow

      - name: Build licensed corpus
        run: |
          for attempt in 1 2 3; do
            if python nova/bootstrap_corpus.py; then exit 0; fi
            echo "corpus bootstrap attempt $attempt failed; retrying"
            rm -f state/wikitext-train-00000-of-00002.parquet.tmp
            sleep 5
          done
          exit 1

      - name: Validate corpus
        run: |
          test -f corpus/wiki.train.tokens
          test -f corpus/CORPUS_LICENSE.json
          test -f corpus/CORPUS_MANIFEST.json
          bytes=$(wc -c < corpus/wiki.train.tokens)
          test "$bytes" -ge "$((NOVA_TARGET_TOKENS + 129))"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("corpus/CORPUS_LICENSE.json")
          x=json.loads(p.read_text())
          assert x.get("licensed") is True
          assert not x.get("synthetic_pretraining", True)
          print("LICENSE_OK")
          PY
          echo "CORPUS_BYTES=$bytes"

      - name: Publish corpus
        uses: actions/upload-artifact@v4
        with:
          name: nova-corpus
          path: |
            corpus/wiki.train.tokens
            corpus/CORPUS_LICENSE.json
            corpus/CORPUS_MANIFEST.json
          if-no-files-found: error
          retention-days: 7

  experts:
    needs: corpus
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - { expert: 0, tokens: 3571429 }
          - { expert: 1, tokens: 3571429 }
          - { expert: 2, tokens: 3571429 }
          - { expert: 3, tokens: 3571429 }
          - { expert: 4, tokens: 3571429 }
          - { expert: 5, tokens: 3571429 }
          - { expert: 6, tokens: 3571429 }
          - { expert: 7, tokens: 3571429 }
          - { expert: 8, tokens: 3571428 }
          - { expert: 9, tokens: 3571428 }
          - { expert: 10, tokens: 3571428 }
          - { expert: 11, tokens: 3571428 }
          - { expert: 12, tokens: 3571428 }
          - { expert: 13, tokens: 3571428 }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nova-production

      - name: Prepare CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1"

      - name: Download licensed corpus
        uses: actions/download-artifact@v4
        with:
          name: nova-corpus
          path: nova-corpus

      - name: Prepare training inputs
        run: |
          mkdir -p corpus
          cp -a nova-corpus/. corpus/
          test -f corpus/wiki.train.tokens
          test -f corpus/CORPUS_LICENSE.json
          test -f corpus/CORPUS_MANIFEST.json
          bytes=$(wc -c < corpus/wiki.train.tokens)
          test "$bytes" -ge "$((NOVA_TARGET_TOKENS + 129))"

      - name: Train expert with checkpoint retries
        run: |
          for attempt in 1 2 3; do
            if python nova/train_expert.py --expert ${{ matrix.expert }} --tokens ${{ matrix.tokens }}; then
              exit 0
            fi
            echo "expert ${{ matrix.expert }} attempt $attempt failed; retrying from local checkpoint"
            sleep 5
          done
          exit 1

      - name: Validate expert
        run: |
          python - <<'PY'
          import torch
          from pathlib import Path
          p=Path("state") / f"expert_${{ matrix.expert }}.pt"
          x=torch.load(p,map_location="cpu",weights_only=False)
          assert int(x["expert_idx"]) == int("${{ matrix.expert }}")
          assert int(x["tokens_seen"]) == int("${{ matrix.tokens }}")
          assert int(x["parameters"]) > 3_000_000
          print("EXPERT_OK", p)
          PY

      - name: Publish expert checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: nova-expert-${{ matrix.expert }}
          path: state/expert_${{ matrix.expert }}.pt
          if-no-files-found: error
          retention-days: 7

  finalize:
    needs: experts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nova-production

      - name: Prepare CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1"

      - name: Download all production inputs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble and finalize Nova
        run: |
          mkdir -p state corpus
          cp -a artifacts/nova-corpus/. corpus/
          python - <<'PY'
          from pathlib import Path
          import shutil
          files = sorted(Path("artifacts").glob("nova-expert-*/state/expert_*.pt"))
          if len(files) != 14:
              raise SystemExit(f"expected 14 expert checkpoints, found {len(files)}")
          for src in files:
              shutil.copy2(src, Path("state") / src.name)
          print("EXPERT_CHECKPOINTS_ASSEMBLED", len(files))
          PY
          python nova/merge_experts.py
          test -s production/final.pt
          test -s production/final_manifest.json
          test -s production/verification.json
          test -s state/evaluation.json
          cat production/final_manifest.json
          cat production/verification.json

      - name: Publish production artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-production-final
          path: |
            production/final.pt
            production/final_manifest.json
            production/verification.json
            state/evaluation.json
            state/sft.json
            state/dpo.json
            corpus/CORPUS_LICENSE.json
            corpus/CORPUS_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
