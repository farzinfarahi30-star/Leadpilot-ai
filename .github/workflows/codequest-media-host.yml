name: CodeQuest Kids Media Host

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          linking-type: static
          github-token: ${{ github.token }}

      - name: Download and extract CodeQuest Kids package
        run: |
          set -euo pipefail
          mkdir -p /tmp/cq/unpacked /tmp/cq/normalized
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://www.dropbox.com/scl/fo/78wrh8g8ay338z7ob19bb/APkrtyg62tb5s5bZo6pn2Ts?rlkey=k4y1b0mn10qvl4sh229e3a9jd&st=qur47vig&dl=1' \
            -o /tmp/cq/package.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          src = Path('/tmp/cq/package.zip')
          out = Path('/tmp/cq/unpacked')
          with ZipFile(src) as z:
              mp4s = [i for i in z.infolist() if i.filename.lower().endswith('.mp4')]
              if len(mp4s) != 30:
                  raise SystemExit(f'Expected 30 MP4s, found {len(mp4s)}')
              for i in mp4s:
                  (out / Path(i.filename).name).write_bytes(z.read(i))
          PY
          test "$(find /tmp/cq/unpacked -maxdepth 1 -type f -name '*.mp4' | wc -l)" -eq 30

      - name: Normalize all videos for Instagram Reels
        run: |
          set -euo pipefail
          for f in /tmp/cq/unpacked/*.mp4; do
            base="$(basename "$f")"
            ffmpeg -hide_banner -loglevel error -y \
              -i "$f" \
              -vf "fps=30,format=yuv420p" \
              -c:v libx264 -preset veryfast -crf 20 \
              -c:a aac -b:a 128k -movflags +faststart \
              "/tmp/cq/normalized/$base"
          done
          test "$(find /tmp/cq/normalized -maxdepth 1 -type f -name '*.mp4' | wc -l)" -eq 30

      - name: Publish 30 normalized MP4s
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin codequest-media || true
          if git show-ref --verify --quiet refs/remotes/origin/codequest-media; then
            git switch -C codequest-media origin/codequest-media
          else
            git switch --orphan codequest-media
            git rm -rf . >/dev/null 2>&1 || true
          fi
          rm -rf media
          mkdir -p media
          cp /tmp/cq/normalized/*.mp4 media/
          test "$(find media -maxdepth 1 -type f -name '*.mp4' | wc -l)" -eq 30
          git add media/*.mp4
          git commit -m 'Publish Instagram-compatible CodeQuest Kids Shorts' || echo 'No media changes'
          git push --force-with-lease origin HEAD:codequest-media
