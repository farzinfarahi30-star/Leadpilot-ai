name: Nova provider discovery

on:
  workflow_dispatch:
  push:
    branches: [nova-gpu]
    paths:
      - ".github/workflows/nova-provider-discovery.yml"

permissions:
  contents: read

jobs:
  modal:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ID: ${{ secrets.MODAL_TOKEN_ID }}
      SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - run: test -n "$ID" && test -n "$SECRET"
  kaggle:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - run: test -n "$TOKEN" || { test -n "$USERNAME" && test -n "$KEY"; }
  huggingface:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TOKEN: ${{ secrets.HF_TOKEN }}
      ALT: ${{ secrets.HUGGINGFACE_TOKEN }}
    steps:
      - run: test -n "$TOKEN" || test -n "$ALT"
  saturn:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TOKEN: ${{ secrets.SATURN_TOKEN }}
    steps:
      - run: test -n "$TOKEN"
  runpod:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TOKEN: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - run: test -n "$TOKEN"
  aws:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - run: test -n "$ID" && test -n "$SECRET"
  gcp:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
    steps:
      - run: test -n "$KEY"
  azure:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CREDS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - run: test -n "$CREDS"