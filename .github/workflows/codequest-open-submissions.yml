name: CodeQuest Kids Open Free Submissions

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Submit no-account listings
        env:
          SITE_URL: https://codequest-kids.azinahi123.workers.dev
          CONTACT_EMAIL: Azinahi123@gmail.com
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const SITE = process.env.SITE_URL;
          const EMAIL = process.env.CONTACT_EMAIL;
          const DESC = 'Free coding adventures for kids ages 7–16 with interactive missions, projects, badges and an AI Coach.';
          const FULL = 'CodeQuest Kids is a free coding-learning platform for kids ages 7–16. It provides interactive coding missions, XP, badges, projects, JavaScript practice and an AI Coach in a kid-friendly web experience.';
          const out = [];
          async function postJSON(url, payload) {
            const r = await fetch(url,{method:'POST',headers:{'content-type':'application/json','user-agent':'CodeQuest-Kids-Launch-Runner'},body:JSON.stringify(payload)});
            const t = await r.text();
            return {status:r.status,text:t.slice(0,1600)};
          }
          async function hypeStar(){
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1440,height:1200}});
            try{
              await p.goto('https://hypestar.org/submit',{waitUntil:'networkidle',timeout:45000});
              const urlInput=p.locator('input').filter({has:undefined}).first();
              const inputs=p.locator('input');
              let filled=false;
              for(let i=0;i<await inputs.count();i++){
                const el=inputs.nth(i), type=(await el.getAttribute('type'))||'', ph=(await el.getAttribute('placeholder'))||'', name=(await el.getAttribute('name'))||'';
                if(type==='url'||/project url|yourproject|public project/i.test(ph+' '+name)){await el.fill(SITE);filled=true;break;}
              }
              if(!filled) await inputs.first().fill(SITE);
              const go=p.getByRole('button',{name:/submit link/i});
              if(await go.count()) await go.first().click();
              await p.waitForTimeout(1800);
              const selects=p.locator('select');
              for(let i=0;i<await selects.count();i++){
                const opts=await selects.nth(i).locator('option').allTextContents();
                const pick=opts.find(x=>/developer/i.test(x))||opts.find(x=>/productivity/i.test(x))||opts.find(x=>/other/i.test(x));
                if(pick) await selects.nth(i).selectOption({label:pick}).catch(()=>{});
              }
              const kind=p.getByRole('radio',{name:/site/i});
              if(await kind.count()) await kind.first().check().catch(()=>{});
              const skip=p.getByRole('button',{name:/skip/i});
              if(await skip.count()) await skip.first().click().catch(()=>{});
              const submit=p.getByRole('button',{name:/submit for review/i});
              if(await submit.count()) await submit.first().click({timeout:15000});
              await p.waitForTimeout(2200);
              out.push(['HypeStar',p.url(),(await p.locator('body').innerText()).slice(-1800)]);
            }catch(e){out.push(['HypeStar','ERROR',e.message]);}
            finally{await b.close();}
          }
          async function linkrena(){
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1440,height:1200}});
            try{
              await p.goto('https://linkrena.com/submit',{waitUntil:'networkidle',timeout:45000});
              const fields=p.locator('input,textarea');
              for(let i=0;i<await fields.count();i++){
                const el=fields.nth(i), type=(await el.getAttribute('type'))||'', name=(await el.getAttribute('name'))||'', ph=(await el.getAttribute('placeholder'))||'', aria=(await el.getAttribute('aria-label'))||'';
                const key=(name+' '+ph+' '+aria).toLowerCase();
                if(type==='url'||key.includes('product url')||key==='url') await el.fill(SITE).catch(()=>{});
                else if(key.includes('email')) await el.fill(EMAIL).catch(()=>{});
                else if(key.includes('name')) await el.fill('CodeQuest Kids').catch(()=>{});
                else if(key.includes('one-line')||key.includes('description')) await el.fill(DESC).catch(()=>{});
              }
              const btn=p.locator('button,input[type=submit]').filter({hasText:/submit/i});
              if(await btn.count()) await btn.last().click({timeout:15000}).catch(()=>{});
              await p.waitForTimeout(2500);
              out.push(['Linkrena',p.url(),(await p.locator('body').innerText()).slice(-1800)]);
            }catch(e){out.push(['Linkrena','ERROR',e.message]);}
            finally{await b.close();}
          }
          async function qevra(){
            try { const r=await postJSON('https://qevra.app/api/submit',{url:SITE,email:EMAIL,name:'CodeQuest Kids',tagline:'Free coding adventures for ages 7–16',description:FULL,category:'Education',board_notes:false}); out.push(['Qevra',r.status,r.text]); }
            catch(e){ out.push(['Qevra','ERROR',e.message]); }
          }
          async function listAi(){
            const b=await chromium.launch({headless:true}); const p=await b.newPage({viewport:{width:1440,height:1400}});
            try{
              await p.goto('https://listai.cc/submit',{waitUntil:'networkidle',timeout:45000});
              const all=p.locator('input,textarea,select');
              for(let i=0;i<await all.count();i++){
                const el=all.nth(i), tag=await el.evaluate(e=>e.tagName.toLowerCase()), type=(await el.getAttribute('type'))||'', name=(await el.getAttribute('name'))||'', ph=(await el.getAttribute('placeholder'))||'', aria=(await el.getAttribute('aria-label'))||'';
                const key=(name+' '+ph+' '+aria).toLowerCase();
                if(tag==='select'){const opts=await el.locator('option').allTextContents(); const pick=opts.find(x=>/education/i.test(x))||opts.find(x=>/other/i.test(x)); if(pick) await el.selectOption({label:pick}).catch(()=>{});}
                else if(type==='url'||key.includes('website')) await el.fill(SITE).catch(()=>{});
                else if(key.includes('email')) await el.fill(EMAIL).catch(()=>{});
                else if(key.includes('tool name')||key==='name') await el.fill('CodeQuest Kids').catch(()=>{});
                else if(key.includes('description')) await el.fill(FULL).catch(()=>{});
              }
              const submit=p.locator('button,input[type=submit]').filter({hasText:/submit/i});
              if(await submit.count()) await submit.last().click({timeout:15000}).catch(()=>{});
              await p.waitForTimeout(2200);
              out.push(['ListAi',p.url(),(await p.locator('body').innerText()).slice(-1600)]);
            }catch(e){out.push(['ListAi','ERROR',e.message]);} finally{await b.close();}
          }
          async function nextAI(){
            const b=await chromium.launch({headless:true}); const p=await b.newPage({viewport:{width:1440,height:1400}});
            try{
              await p.goto('https://www.thenextai.com/submit-ai-tool/',{waitUntil:'networkidle',timeout:45000});
              const all=p.locator('input,textarea,select');
              for(let i=0;i<await all.count();i++){
                const el=all.nth(i), tag=await el.evaluate(e=>e.tagName.toLowerCase()), type=(await el.getAttribute('type'))||'', name=(await el.getAttribute('name'))||'', ph=(await el.getAttribute('placeholder'))||'', aria=(await el.getAttribute('aria-label'))||'';
                const key=(name+' '+ph+' '+aria).toLowerCase();
                if(tag==='select'){const opts=await el.locator('option').allTextContents(); const pick=opts.find(x=>/education/i.test(x))||opts.find(x=>/developer/i.test(x))||opts.find(x=>/coding/i.test(x))||opts.find(x=>/other/i.test(x)); if(pick) await el.selectOption({label:pick}).catch(()=>{});}
                else if(type==='url'||key.includes('website')) await el.fill(SITE).catch(()=>{});
                else if(key.includes('email')) await el.fill(EMAIL).catch(()=>{});
                else if(key.includes('tool name')) await el.fill('CodeQuest Kids').catch(()=>{});
                else if(key.includes('short description')) await el.fill('Free coding adventures for kids ages 7–16.').catch(()=>{});
                else if(key.includes('full description')) await el.fill(FULL).catch(()=>{});
                else if(key.includes('tags')) await el.fill('coding, kids, education, JavaScript, learning, free').catch(()=>{});
              }
              const submit=p.locator('button,input[type=submit]').filter({hasText:/submit/i});
              if(await submit.count()) await submit.last().click({timeout:15000}).catch(()=>{});
              await p.waitForTimeout(2200);
              out.push(['TheNextAI',p.url(),(await p.locator('body').innerText()).slice(-1700)]);
            }catch(e){out.push(['TheNextAI','ERROR',e.message]);} finally{await b.close();}
          }
          async function site(){ const r=await fetch(SITE,{redirect:'follow'}); const t=await r.text(); out.push(['SITE',r.status,r.url,t.includes('CodeQuest'),t.length]); }
          (async()=>{ await site(); await hypeStar(); await linkrena(); await qevra(); await listAi(); await nextAI(); for(const x of out) console.log(x.map(v=>typeof v==='string'?v:JSON.stringify(v)).join(' | ')); })().catch(e=>{console.error(e);process.exit(1)});
          NODE
