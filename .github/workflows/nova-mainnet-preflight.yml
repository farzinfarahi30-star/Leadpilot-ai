name: NOVA Ethereum Mainnet Preflight

on:
  push:
    branches:
      - boss-nova-mainnet-preflight-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      NOVA_DEPLOYER_PRIVATE_KEY: ${{ secrets.NOVA_DEPLOYER_PRIVATE_KEY }}
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
      NOVA_OWNER: ${{ secrets.NOVA_OWNER || '0x63970A951bd69975eF2aDAD27bf73584D2DCeF9B' }}
      NOVA_MAX_SUPPLY_TOKENS: ${{ secrets.NOVA_MAX_SUPPLY_TOKENS || '1000000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Check mainnet chain and signer
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOVA_DEPLOYER_PRIVATE_KEY"
          test -n "$MAINNET_RPC_URL"
          test -n "$NOVA_OWNER"
          [[ "$NOVA_OWNER" =~ ^0x[0-9a-fA-F]{40}$ ]]
          CHAIN_ID="$(cast chain-id --rpc-url "$MAINNET_RPC_URL")"
          test "$CHAIN_ID" = "1"
          DEPLOYER="$(cast wallet address --private-key "$NOVA_DEPLOYER_PRIVATE_KEY")"
          BALANCE_ETH="$(cast balance "$DEPLOYER" --ether --rpc-url "$MAINNET_RPC_URL")"
          OWNER_BALANCE_ETH="$(cast balance "$NOVA_OWNER" --ether --rpc-url "$MAINNET_RPC_URL")"
          echo "chain_id=$CHAIN_ID"
          echo "deployer=$DEPLOYER"
          echo "deployer_eth=$BALANCE_ETH"
          echo "owner=$NOVA_OWNER"
          echo "owner_eth=$OWNER_BALANCE_ETH"
          python - <<'PY'
          import os, subprocess
          cap = int(os.environ["NOVA_MAX_SUPPLY_TOKENS"])
          if cap <= 0:
              raise SystemExit("NOVA_MAX_SUPPLY_TOKENS must be positive")
          print("preflight_configuration_valid")
          PY
