name: CodeQuest Kids Fast Outbound Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outbound:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public submission forms and Qevra API
        env:
          SITE_URL: https://codequest-kids.azinahi123.workers.dev
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.parse, re
          from html.parser import HTMLParser

          SITE=os.environ['SITE_URL']
          HEADERS={'User-Agent':'Mozilla/5.0 CodeQuest-Kids-Launch-Runner'}

          def get(url):
              req=urllib.request.Request(url,headers=HEADERS)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.status, r.geturl(), r.read().decode('utf-8','replace')

          def post_json(url,payload):
              data=__import__('json').dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers={**HEADERS,'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.status, r.geturl(), r.read().decode('utf-8','replace')

          print('SITE CHECK')
          try:
              s,u,b=get(SITE)
              print(s,u,'CodeQuest' in b,'bytes',len(b))
          except Exception as e: print('SITE_ERROR',repr(e))

          print('QEVRA POST')
          try:
              s,u,b=post_json('https://qevra.app/api/submit',{
                'url':SITE,
                'name':'CodeQuest Kids',
                'tagline':'Free coding adventures for ages 7–16',
                'description':'A free coding-learning platform for kids ages 7–16 with missions, XP, badges, projects, JavaScript practice and an AI Coach. No subscription or joining fee.',
                'category':'Education',
                'board_notes':False
              })
              print(s,u,b[:1000])
          except Exception as e: print('QEVRA_ERROR',repr(e))

          class P(HTMLParser):
              def __init__(self): super().__init__(); self.forms=[]; self.f=None
              def handle_starttag(self,t,a):
                  d=dict(a)
                  if t=='form': self.f={'action':d.get('action',''),'method':d.get('method','get'),'fields':[]}; self.forms.append(self.f)
                  elif self.f and t in ('input','textarea','select','button'):
                      self.f['fields'].append({k:d.get(k,'') for k in ('tag','name','type','value','placeholder','id')})
              def handle_endtag(self,t):
                  if t=='form': self.f=None

          pages={
            'ProductReveal':'https://productreveal.online/submit-product',
            'LaunchFree':'https://launchfree.io/submit.html',
            'LaunchingNext':'https://www.launchingnext.com/submit/',
            'HypeStar':'https://hypestar.org/submit',
            'Ignlab':'https://launch.ignlab.net/',
            '10015':'https://10015.io/product-finder/submit'
          }
          for name,url in pages.items():
              print('\nFORM',name,url)
              try:
                  s,u,b=get(url); print('GET',s,u,'bytes',len(b))
                  p=P(); p.feed(b)
                  for f in p.forms:
                      print('FORMDEF',f['method'],f['action'],f['fields'][:30])
              except Exception as e: print('FORM_ERROR',repr(e))
          PY
