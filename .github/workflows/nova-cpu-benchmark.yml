name: Nova CPU benchmark

on:
  workflow_dispatch:
  push:
    branches: [nova-gpu]
    paths:
      - ".github/workflows/nova-cpu-benchmark.yml"
      - "nova/**"
      - "nova_ai/**"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU dependencies
        run: python -m pip install --upgrade torch tokenizers datasets
      - name: Benchmark 20 optimizer steps
        run: |
          python - <<'PY'
          import time, torch
          from nova_ai.model import NovaLM, NovaConfig
          torch.set_num_threads(4)
          m=NovaLM(NovaConfig()).train()
          opt=torch.optim.AdamW(m.parameters(), lr=3e-4)
          x=torch.randint(0,8192,(2,1024))
          y=torch.randint(0,8192,(2,1024))
          t=time.time(); tokens=0
          for i in range(20):
              opt.zero_grad(set_to_none=True)
              out=m(x,y)
              loss=out.loss if hasattr(out,'loss') else out
              loss.backward(); opt.step(); tokens += x.numel()
              if i==0: print('first_step_seconds=',round(time.time()-t,3))
          dt=time.time()-t
          print('steps=20')
          print('tokens=',tokens)
          print('seconds=',round(dt,3))
          print('tokens_per_second=',round(tokens/dt,2))
          print('estimated_hours_50m=',round(50_000_000/(tokens/dt)/3600,2))
          PY