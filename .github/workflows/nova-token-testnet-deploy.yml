name: Nova Token Testnet Deploy

on:
  push:
    branches: [main]
    paths:
      - '.nova/deploy-sepolia.once'
  workflow_dispatch:
    inputs:
      owner:
        description: Public NOVA owner/treasury address
        required: true
        default: "0x63970A951bd69975eF2aDAD27bf73584D2DCeF9B"
        type: string
      max_supply_tokens:
        description: Maximum NOVA supply in whole tokens for this deployment
        required: true
        default: "1000000"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NOVA_OWNER: ${{ inputs.owner || '0x63970A951bd69975eF2aDAD27bf73584D2DCeF9B' }}
      NOVA_MAX_SUPPLY_TOKENS: ${{ inputs.max_supply_tokens || '1000000' }}
      NOVA_DEPLOYER_PRIVATE_KEY: ${{ secrets.NOVA_DEPLOYER_PRIVATE_KEY }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Validate required secrets and owner
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOVA_DEPLOYER_PRIVATE_KEY"
          test -n "$SEPOLIA_RPC_URL"
          [[ "$NOVA_OWNER" =~ ^0x[0-9a-fA-F]{40}$ ]]
          python - <<'PY'
          import os
          cap = int(os.environ["NOVA_MAX_SUPPLY_TOKENS"])
          if cap <= 0:
              raise SystemExit("max_supply_tokens must be positive")
          print("configuration_valid")
          PY

      - name: Install Solidity dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: Format check
        run: forge fmt --check

      - name: Contract tests
        run: forge test -vv

      - name: Build
        run: forge build

      - name: Deploy with Nova owner
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          forge script nova-economy/script/DeployNovaToken.s.sol:DeployNovaToken --rpc-url "$SEPOLIA_RPC_URL" --broadcast

      - name: Verify on-chain ownership and cap
        shell: bash
        run: |
          set -euo pipefail
          test -f nova-economy/broadcast/DeployNovaToken.s.sol/11155111/run-latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("nova-economy/broadcast/DeployNovaToken.s.sol/11155111/run-latest.json")
          d=json.loads(p.read_text())
          txs=d.get("transactions",[])
          deployed=[x for x in txs if x.get("transactionType")=="CREATE" and x.get("contractName")=="NovaToken"]
          if not deployed:
              raise SystemExit("NovaToken CREATE transaction not found")
          tx=deployed[-1]
          addr=tx.get("contractAddress")
          if not addr:
              raise SystemExit("contractAddress missing")
          tx_hash=tx.get("hash") or tx.get("transactionHash") or tx.get("txHash")
          block=tx.get("blockNumber")
          Path("nova-economy/deployment-address.txt").write_text(addr+"\n")
          metadata={
              "network":"sepolia",
              "chainId":11155111,
              "owner":os.environ["NOVA_OWNER"],
              "maxSupplyTokens":int(os.environ["NOVA_MAX_SUPPLY_TOKENS"]),
              "contractAddress":addr,
              "transactionHash":tx_hash,
              "blockNumber":block
          }
          Path("nova-economy/deployment-sepolia.json").write_text(json.dumps(metadata, indent=2)+"\n")
          print("NOVA_CONTRACT_ADDRESS="+addr)
          print("NOVA_TRANSACTION_HASH="+str(tx_hash))
          print("NOVA_BLOCK_NUMBER="+str(block))
          PY

      - name: Verify deployment on-chain
        shell: bash
        env:
          EXPECTED_OWNER: ${{ inputs.owner || '0x63970A951bd69975eF2aDAD27bf73584D2DCeF9B' }}
        run: |
          set -euo pipefail
          ADDR="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("nova-economy/broadcast/DeployNovaToken.s.sol/11155111/run-latest.json")
          d=json.loads(p.read_text())
          deployed=[x for x in d.get("transactions",[]) if x.get("transactionType")=="CREATE" and x.get("contractName")=="NovaToken"]
          if not deployed:
              raise SystemExit("NovaToken CREATE transaction not found")
          addr=deployed[-1].get("contractAddress")
          if not addr:
              raise SystemExit("contractAddress missing")
          print(addr)
          Path("nova-economy/deployment-address.txt").write_text(addr+"\n")
          PY
          )"
          ONCHAIN_OWNER="$(cast call "$ADDR" "owner()(address)" --rpc-url "$SEPOLIA_RPC_URL")"
          ONCHAIN_CAP="$(cast call "$ADDR" "maxSupply()(uint256)" --rpc-url "$SEPOLIA_RPC_URL")"
          ONCHAIN_SUPPLY="$(cast call "$ADDR" "totalSupply()(uint256)" --rpc-url "$SEPOLIA_RPC_URL")"
          export ONCHAIN_OWNER ONCHAIN_CAP ONCHAIN_SUPPLY
          python - <<'PY'
          import os
          expected_cap=int(os.environ["NOVA_MAX_SUPPLY_TOKENS"])*10**18
          if os.environ["ONCHAIN_OWNER"].lower()!=os.environ["EXPECTED_OWNER"].lower():
              raise SystemExit("owner mismatch")
          if int(os.environ["ONCHAIN_CAP"])!=expected_cap:
              raise SystemExit("maxSupply mismatch")
          if int(os.environ["ONCHAIN_SUPPLY"])!=0:
              raise SystemExit("totalSupply must start at zero")
          print("onchain_verification_pass")
          with open("nova-economy/deployment-verification.txt","w") as f:
              f.write("owner="+os.environ["ONCHAIN_OWNER"]+"\n")
              f.write("maxSupplyWei="+os.environ["ONCHAIN_CAP"]+"\n")
              f.write("totalSupplyWei="+os.environ["ONCHAIN_SUPPLY"]+"\n")
          PY

      - name: Upload public deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: nova-token-sepolia-deployment
          path: |
            nova-economy/deployment-address.txt
            nova-economy/deployment-sepolia.json
            nova-economy/deployment-verification.txt
            nova-economy/broadcast/DeployNovaToken.s.sol/11155111/run-latest.json
          if-no-files-found: error
