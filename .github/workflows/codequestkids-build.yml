name: Build CodeQuest Kids 1.2.1

on:
  push:
    branches:
      - codequestkids-build-20260917
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          APP=CodeQuestKidsBuild/App
          mkdir -p "$APP/app/src/main/java/com/codequestkids/learn"
          mkdir -p "$APP/app/src/main/res/values" "$APP/app/src/main/res/drawable"
          cat > "$APP/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name='CodeQuestKidsApp'
          include ':app'
          EOF
          cat > "$APP/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > "$APP/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          cat > "$APP/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.codequestkids.learn'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.codequestkids.learn'
                  minSdk 24
                  targetSdk 35
                  versionCode 4
                  versionName '1.2.1'
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release { minifyEnabled false; shrinkResources false; signingConfig signingConfigs.release }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > "$APP/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="false" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:label="@string/app_name" android:supportsRtl="true" android:theme="@style/AppTheme" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > "$APP/app/src/main/res/values/strings.xml" <<'EOF'
          <resources><string name="app_name">CodeQuest Kids</string></resources>
          EOF
          cat > "$APP/app/src/main/res/values/styles.xml" <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#2257D6</item><item name="android:navigationBarColor">#FFFFFF</item><item name="android:statusBarColor">#FFFFFF</item><item name="android:windowLightStatusBar">true</item></style></resources>
          EOF
          cat > "$APP/app/src/main/res/drawable/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#2257D6" android:pathData="M24,2A22,22 0,1 0,24 46A22,22 0,1 0,24 2" />
              <path android:fillColor="#FFFFFF" android:pathData="M15,14L29,24L15,34V29L23,24L15,19Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M31,30h7v4h-7z" />
          </vector>
          EOF
          cat > "$APP/app/src/main/java/com/codequestkids/learn/MainActivity.java" <<'EOF'
          package com.codequestkids.learn;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              private static final String SITE="https://codequest-kids.azinahi123.workers.dev";
              private static final String HOST="codequest-kids.azinahi123.workers.dev";
              private WebView web; private View offline;
              @Override protected void onCreate(Bundle state){super.onCreate(state);buildUi();configure();if(state==null)web.loadUrl(SITE);else web.restoreState(state);}
              private void buildUi(){LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setBackgroundColor(Color.WHITE);web=new WebView(this);offline=offlineView();offline.setVisibility(View.GONE);root.addView(web,new LinearLayout.LayoutParams(-1,-1,1));root.addView(offline,new LinearLayout.LayoutParams(-1,-1));setContentView(root);}
              private View offlineView(){LinearLayout box=new LinearLayout(this);box.setOrientation(LinearLayout.VERTICAL);box.setGravity(Gravity.CENTER);box.setPadding(48,48,48,48);TextView t=new TextView(this);t.setText("CodeQuest Kids");t.setTextSize(28);t.setTextColor(Color.rgb(22,33,62));t.setGravity(Gravity.CENTER);TextView m=new TextView(this);m.setText("Couldn’t load CodeQuest Kids.\n\nCheck your internet connection and try again.");m.setTextSize(17);m.setGravity(Gravity.CENTER);m.setPadding(0,20,0,24);Button b=new Button(this);b.setText("Try again");b.setOnClickListener(v->{offline.setVisibility(View.GONE);web.setVisibility(View.VISIBLE);web.loadUrl(SITE);});box.addView(t);box.addView(m);box.addView(b);return box;}
              private void configure(){WebSettings s=web.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setDatabaseEnabled(true);s.setSupportZoom(false);s.setBuiltInZoomControls(false);s.setDisplayZoomControls(false);s.setAllowFileAccess(false);s.setAllowContentAccess(false);s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);s.setTextZoom(100);web.setBackgroundColor(Color.WHITE);web.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){return route(r.getUrl());}@Override public boolean shouldOverrideUrlLoading(WebView v,String u){return route(Uri.parse(u));}@Override public void onPageFinished(WebView v,String u){web.setVisibility(View.VISIBLE);offline.setVisibility(View.GONE);}@Override public void onReceivedError(WebView v,WebResourceRequest r,WebResourceError e){if(r.isForMainFrame())showOffline();}});}
              private boolean route(Uri u){if(u==null)return true;String sc=u.getScheme(),h=u.getHost();if("https".equalsIgnoreCase(sc)&&h!=null&&(HOST.equalsIgnoreCase(h)||h.endsWith("."+HOST)))return false;if("http".equalsIgnoreCase(sc)||"https".equalsIgnoreCase(sc))startActivity(new Intent(Intent.ACTION_VIEW,u));return true;}
              private void showOffline(){web.setVisibility(View.GONE);offline.setVisibility(View.VISIBLE);}
              @Override public void onBackPressed(){if(web.canGoBack())web.goBack();else super.onBackPressed();}
              @Override protected void onSaveInstanceState(Bundle out){web.saveState(out);super.onSaveInstanceState(out);}
              @Override protected void onDestroy(){if(web!=null)web.destroy();super.onDestroy();}
          }
          EOF

      - name: Create release signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/CodeQuestKidsBuild/keys"
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/CodeQuestKidsBuild/keys/codequest-kids-release.jks" -storetype JKS -storepass 'CodeQuestKids2026' -keypass 'CodeQuestKids2026' -alias 'codequestkids' -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=CodeQuest Kids, OU=CodeQuest Kids, O=CodeQuest Kids, L=Remote, ST=Global, C=US'
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/CodeQuestKidsBuild/keys/codequest-kids-release.jks" >> "$GITHUB_ENV"
          echo 'ANDROID_KEYSTORE_PASSWORD=CodeQuestKids2026' >> "$GITHUB_ENV"
          echo 'ANDROID_KEY_ALIAS=codequestkids' >> "$GITHUB_ENV"
          echo 'ANDROID_KEY_PASSWORD=CodeQuestKids2026' >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: CodeQuestKidsBuild/App
        run: gradle --no-daemon clean assembleRelease

      - name: Validate APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='CodeQuestKidsBuild/App/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.codequestkids.learn' versionCode='4' versionName='1.2.1'" /tmp/badging.txt
          grep -q "application-label:'CodeQuest Kids'" /tmp/badging.txt
          "$SIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee CodeQuestKidsBuild/SHA256.txt
          cp "$APK" CodeQuestKidsBuild/CodeQuest-Kids-1.2.1-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeQuest-Kids-1.2.1-release
          path: |
            CodeQuestKidsBuild/CodeQuest-Kids-1.2.1-release.apk
            CodeQuestKidsBuild/SHA256.txt
          if-no-files-found: error
          retention-days: 30
