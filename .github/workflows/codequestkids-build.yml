name: Build CodeQuest Kids Uptodown 1.2.1

on:
  push:
    branches:
      - codequestkids-uptodown-fix-20260918
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate native Android project
        shell: bash
        run: |
          set -euo pipefail
          APP=CodeQuestKidsBuild/App
          mkdir -p "$APP/app/src/main/java/com/codequestkids/app"
          mkdir -p "$APP/app/src/main/res/values" "$APP/app/src/main/res/drawable"
          cat > "$APP/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='CodeQuestKidsApp'
          include ':app'
          EOF
          cat > "$APP/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > "$APP/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          cat > "$APP/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.codequestkids.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.codequestkids.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 4
                  versionName '1.2.1'
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release { minifyEnabled false; shrinkResources false; signingConfig signingConfigs.release }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > "$APP/app/src/main/res/values/strings.xml" <<'EOF'
          <resources><string name="app_name">CodeQuest Kids</string></resources>
          EOF
          cat > "$APP/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowLightStatusBar">true</item>
              <item name="android:statusBarColor">#FFFFFF</item>
              <item name="android:navigationBarColor">#FFFFFF</item>
              <item name="android:colorAccent">#2257D6</item>
            </style>
          </resources>
          EOF
          cat > "$APP/app/src/main/res/drawable/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp"
              android:viewportWidth="48" android:viewportHeight="48">
            <path android:fillColor="#2257D6" android:pathData="M24,2A22,22 0,1 0,24 46A22,22 0,1 0,24 2" />
            <path android:fillColor="#FFFFFF" android:pathData="M15,14L29,24L15,34V29L23,24L15,19Z" />
            <path android:fillColor="#FFFFFF" android:pathData="M31,30h7v4h-7z" />
          </vector>
          EOF
          cat > "$APP/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:allowBackup="false"
              android:icon="@drawable/ic_launcher"
              android:roundIcon="@drawable/ic_launcher"
              android:label="@string/app_name"
              android:supportsRtl="true"
              android:theme="@style/AppTheme"
              android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > "$APP/app/src/main/java/com/codequestkids/app/MainActivity.java" <<'EOF'
          package com.codequestkids.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.AdapterView;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.TextView;
          import java.util.Arrays;

          public class MainActivity extends Activity {
            private static final String SITE = "https://codequest-kids.azinahi123.workers.dev";
            private static final String HOST = "codequest-kids.azinahi123.workers.dev";
            private static final int BG = Color.rgb(248,250,252);
            private static final int TEXT = Color.rgb(22,33,62);
            private final String[] tracks = {"7–9","10–12","13–16"};
            private SharedPreferences prefs;
            private LinearLayout root;
            private int screen = 0;
            private String track;

            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              prefs = getSharedPreferences("progress", Context.MODE_PRIVATE);
              track = prefs.getString("track", "10–12");
              showHome();
            }

            private TextView text(String value, float size, boolean bold) {
              TextView t = new TextView(this);
              t.setText(value);
              t.setTextSize(size);
              t.setTextColor(TEXT);
              t.setPadding(0,8,0,8);
              if (bold) t.setTypeface(null, 1);
              return t;
            }

            private Button button(String label, View.OnClickListener click) {
              Button b = new Button(this);
              b.setText(label);
              b.setAllCaps(false);
              b.setOnClickListener(click);
              return b;
            }

            private void shell(String title, String subtitle) {
              ScrollView scroll = new ScrollView(this);
              root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setPadding(32,28,32,32);
              root.setBackgroundColor(BG);
              root.addView(text(title, 30, true));
              root.addView(text(subtitle, 16, false));
              scroll.addView(root);
              setContentView(scroll);
            }

            private void showHome() {
              screen = 0;
              shell("CodeQuest Kids", "Build games. Learn code. Create the future.");
              root.addView(text("Your learning track", 20, true));
              Spinner sp = new Spinner(this);
              sp.setAdapter(new ArrayAdapter<String>(this, android.R.layout.simple_spinner_dropdown_item, tracks));
              int idx = Arrays.asList(tracks).indexOf(track);
              if (idx < 0) idx = 1;
              sp.setSelection(idx);
              sp.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener() {
                @Override public void onNothingSelected(AdapterView<?> p) {}
                @Override public void onItemSelected(AdapterView<?> p, View v, int pos, long id) {
                  track = tracks[pos];
                  prefs.edit().putString("track", track).apply();
                }
              });
              root.addView(sp, new LinearLayout.LayoutParams(-1, -2));
              root.addView(progressCard(), new LinearLayout.LayoutParams(-1, -2));
              root.addView(text("Learn", 20, true));
              root.addView(button("Missions", v -> showMissions()));
              root.addView(button("Coding Lab", v -> showCodingLab()));
              root.addView(button("Online Academy", v -> showOnlineAcademy()));
              root.addView(button("Parent / Guardian Progress", v -> showParent()));
              root.addView(text("Core missions, XP and progress work offline. The official online academy is an optional connected feature.", 14, false));
            }

            private View progressCard() {
              LinearLayout box = new LinearLayout(this);
              box.setOrientation(LinearLayout.VERTICAL);
              box.setPadding(20,18,20,18);
              box.setBackgroundColor(Color.WHITE);
              int xp = prefs.getInt("xp_"+track, 0);
              int completed = prefs.getInt("completed_"+track, 0);
              box.addView(text("Track: "+track, 18, true));
              box.addView(text(xp+" XP  •  "+completed+" missions completed", 16, false));
              ProgressBar p = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
              p.setMax(100);
              p.setProgress(Math.min(100, completed * 25));
              box.addView(p, new LinearLayout.LayoutParams(-1, 24));
              return box;
            }

            private String[] missionSet() {
              if (track.equals("7–9")) return new String[]{
                "Make a character move","Collect stars","Build a clickable button","Tell a coding story"
              };
              if (track.equals("13–16")) return new String[]{
                "Use arrays and objects","Manage game state","Handle DOM events","Debug a broken program","Build a mini web game"
              };
              return new String[]{
                "Use variables","Master loops","Write functions","Fix a JavaScript bug","Build a mini game"
              };
            }

            private void showMissions() {
              screen = 1;
              shell("Missions • "+track, "Finish missions to earn local XP.");
              String[] missions = missionSet();
              int completed = prefs.getInt("completed_"+track, 0);
              for (int i=0; i<missions.length; i++) {
                final int n = i;
                Button b = button((i < completed ? "✓ " : "") + missions[i] + "  +25 XP", v -> {
                  int done = prefs.getInt("completed_"+track, 0);
                  if (n < done) return;
                  int next = Math.min(missions.length, n+1);
                  prefs.edit().putInt("completed_"+track, next).putInt("xp_"+track, next*25).apply();
                  showMissions();
                });
                root.addView(b);
              }
              root.addView(button("Back to Home", v -> showHome()));
            }

            private void showParent() {
              screen = 2;
              shell("Parent / Guardian", "Progress stored locally on this device.");
              int total = 0;
              int xp = 0;
              for (String t : tracks) {
                total += prefs.getInt("completed_"+t, 0);
                xp += prefs.getInt("xp_"+t, 0);
              }
              root.addView(text("Current track: "+track, 18, true));
              root.addView(text("Total XP: "+xp+"\nMissions completed: "+total+"\nNo account or advertising is required.", 17, false));
              root.addView(button("Reset local progress", v -> new AlertDialog.Builder(this)
                .setTitle("Reset progress?")
                .setMessage("This removes only CodeQuest Kids progress stored on this device.")
                .setNegativeButton("Cancel", null)
                .setPositiveButton("Reset", (d,w) -> {
                  prefs.edit().clear().putString("track","10–12").apply();
                  track = "10–12";
                  showParent();
                })
                .show()));
              root.addView(button("Back to Home", v -> showHome()));
            }

            private void showCodingLab() {
              screen = 3;
              WebView w = new WebView(this);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
              w.setWebChromeClient(new WebChromeClient());
              w.setBackgroundColor(BG);
              String html = """
                <!doctype html>
                <html><head><meta name="viewport" content="width=device-width,initial-scale=1">
                <style>
                body{font-family:sans-serif;background:#f8fafc;padding:20px;color:#16213e}
                textarea{width:100%;height:260px;font:15px monospace;padding:12px;box-sizing:border-box}
                button{padding:12px 18px;margin:8px 6px 8px 0;font-size:16px}
                pre{background:#111;color:#eee;padding:12px;min-height:100px;white-space:pre-wrap}
                iframe{width:1px;height:1px;border:0}
                </style></head><body>
                <h1>AI Coding Lab</h1>
                <p>Write JavaScript and run it inside a sandboxed iframe.</p>
                <textarea id="code">const player = { name: 'Nova', score: 0 };
                player.score += 10;
                console.log(player.name, player.score);</textarea>
                <br>
                <button onclick="run()">Run code</button>
                <button onclick="starter()">Starter</button>
                <button onclick="history.back()">Back</button>
                <pre id="out">Console output appears here.</pre>
                <iframe id="runner" sandbox="allow-scripts"></iframe>
                <script>
                function starter(){
                  document.getElementById('code').value =
                    "const player = { name: 'Nova', score: 0 };\nplayer.score += 10;\nconsole.log(player.name, player.score);";
                }
                window.addEventListener('message',e=>{
                  if(e.data && e.data.kind==='cq-log'){
                    document.getElementById('out').textContent += e.data.text + String.fromCharCode(10);
                  }
                });
                function run(){
                  document.getElementById('out').textContent='';
                  const code=document.getElementById('code').value;
                  const payload=JSON.stringify(code);
                  document.getElementById('runner').srcdoc =
                    '<script>try{const c='+payload+
                    ';console.log=function(){parent.postMessage({kind:"cq-log",text:Array.from(arguments).join(" ")},"*");};'+
                    'eval(c);}catch(e){parent.postMessage({kind:"cq-log",text:"Error: "+e.message},"*");}<\/script>';
                }
                </script></body></html>
                """;
              w.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
              setContentView(w);
            }

            private void showOnlineAcademy() {
              screen = 4;
              WebView w = new WebView(this);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(false);
              w.setWebChromeClient(new WebChromeClient());
              w.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  return route(r.getUrl());
                }
                @Override public boolean shouldOverrideUrlLoading(WebView v, String u) {
                  return route(Uri.parse(u));
                }
              });
              setContentView(w);
              w.loadUrl(SITE);
            }

            private boolean route(Uri u) {
              if (u == null) return true;
              String scheme = u.getScheme();
              String host = u.getHost();
              if ("https".equalsIgnoreCase(scheme) && host != null &&
                  (HOST.equalsIgnoreCase(host) || host.endsWith("."+HOST))) return false;
              if ("http".equalsIgnoreCase(scheme) || "https".equalsIgnoreCase(scheme)) {
                try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
              }
              return true;
            }

            @Override public void onBackPressed() {
              if (screen != 0) showHome(); else super.onBackPressed();
            }
          }
EOF
          EOF
          cp "$GITHUB_WORKSPACE/CodeQuestKidsBuild/MainActivity.java" "$APP/app/src/main/java/com/codequestkids/app/MainActivity.java"

      - name: Create release signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/CodeQuestKidsBuild/keys"
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/CodeQuestKidsBuild/keys/codequest-kids-release.jks" -storetype JKS -storepass 'CodeQuestKids2026' -keypass 'CodeQuestKids2026' -alias 'codequestkids' -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=CodeQuest Kids, OU=CodeQuest Kids, O=CodeQuest Kids, L=Remote, ST=Global, C=US'
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/CodeQuestKidsBuild/keys/codequest-kids-release.jks" >> "$GITHUB_ENV"
          echo 'ANDROID_KEYSTORE_PASSWORD=CodeQuestKids2026' >> "$GITHUB_ENV"
          echo 'ANDROID_KEY_ALIAS=codequestkids' >> "$GITHUB_ENV"
          echo 'ANDROID_KEY_PASSWORD=CodeQuestKids2026' >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: CodeQuestKidsBuild/App
        run: gradle --no-daemon clean assembleRelease

      - name: Validate APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='CodeQuestKidsBuild/App/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.codequestkids.app' versionCode='4' versionName='1.2.1'" /tmp/badging.txt
          grep -q "application-label:'CodeQuest Kids'" /tmp/badging.txt
          "$SIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee CodeQuestKidsBuild/SHA256.txt
          cp "$APK" CodeQuestKidsBuild/CodeQuest-Kids-1.2.1-Uptodown.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeQuest-Kids-1.2.1-Uptodown
          path: |
            CodeQuestKidsBuild/CodeQuest-Kids-1.2.1-Uptodown.apk
            CodeQuestKidsBuild/SHA256.txt
          if-no-files-found: error
          retention-days: 30
