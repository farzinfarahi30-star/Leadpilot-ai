name: Boss Nova Sepolia Ephemeral Deployment

on:
  push:
    branches:
      - boss-nova-sepolia-final-20260921
    paths-ignore:
      - "nova-economy/deployment-address.txt"
      - "nova-economy/deployment-sepolia.json"
      - "nova-economy/deployment-verification.txt"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NOVA_OWNER: "0x63970A951bd69975eF2aDAD27bf73584D2DCeF9B"
      NOVA_MAX_SUPPLY_TOKENS: "1000000"
      SEPOLIA_RPC_URL: "https://ethereum-sepolia-rpc.publicnode.com"



    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Require latest Boss branch head
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='boss-nova-sepolia-final-20260921'
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$REMOTE_HEAD" = "${GITHUB_SHA}"
          echo "latest_branch_head_confirmed"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NOVA_OWNER" =~ ^0x[0-9a-fA-F]{40}$ ]]
          python - <<'PY'
          import os
          cap=int(os.environ["NOVA_MAX_SUPPLY_TOKENS"])
          assert cap > 0
          print("configuration_valid")
          PY

      - name: Install Solidity dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: Format, test, build
        run: |
          forge fmt --check
          forge test -vv
          forge build

      - name: Generate disposable Sepolia deployer
        id: key
        shell: bash
        run: |
          set -euo pipefail
          KEY="0x$(openssl rand -hex 32)"
          ADDR="$(cast wallet address --private-key "$KEY")"
          echo "deployer_address=$ADDR" >> "$GITHUB_OUTPUT"
          printf '%s' "$KEY" > "$RUNNER_TEMP/nova_deployer_key"
          chmod 600 "$RUNNER_TEMP/nova_deployer_key"
          unset KEY

      - name: Validate disposable deployer address
        env:
          DEPLOYER_ADDRESS: ${{ steps.key.outputs.deployer_address }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYER_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]
          echo "deployer_address_format_valid"

      - name: Fund disposable deployer through public Sepolia faucets
        env:
          DEPLOYER_ADDRESS: ${{ steps.key.outputs.deployer_address }}
        shell: bash
        run: |
          set -euo pipefail

          PLAYWRIGHT_DIR="$RUNNER_TEMP/nova-playwright"
          npm install --prefix "$PLAYWRIGHT_DIR" --no-package-lock playwright@1.55.0 >/dev/null 2>&1
          "$PLAYWRIGHT_DIR/node_modules/.bin/playwright" install chromium >/dev/null

          cat > "$RUNNER_TEMP/claim_sep_eth.cjs" <<'JS'
          const { chromium } = require("playwright");
          const fs = require("node:fs");

          (async () => {
            const address = process.env.DEPLOYER_ADDRESS;
            if (!/^0x[a-fA-F0-9]{40}$/.test(address)) throw new Error("invalid deployer address");

            const urls = [
              "https://ethfaucet.com/networks/ethereum/ethereum-sepolia",
              "https://ghostchain.io/faucet/ethereum-sepolia/",
              "https://faucet.ghostchain.io/"
            ];

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
            });

            let lastError = "all public Sepolia faucet attempts failed";

            try {
              for (const url of urls) {
                const page = await context.newPage();
                const responseHashes = [];
                page.on("response", async (response) => {
                  try {
                    if (response.status() >= 200 && response.status() < 400) {
                      const ct = response.headers()["content-type"] || "";
                      if (ct.includes("application/json")) {
                        const body = await response.text();
                        for (const h of (body.match(/0x[a-fA-F0-9]{64}/g) || [])) responseHashes.push(h);
                      }
                    }
                  } catch {}
                });

                try {
                  await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
                  await page.waitForTimeout(2500);

                  let bodyText = (await page.locator("body").innerText()).slice(0, 30000);
                  if (/captcha|turnstile|recaptcha|cloudflare challenge|verify you are human/i.test(bodyText)) {
                    throw new Error("interactive anti-bot challenge detected; no bypass attempted");
                  }

                  const visibleInputs = await page.locator("input:visible").evaluateAll((els) =>
                    els.map((el) => ({
                      type: el.getAttribute("type") || "text",
                      name: el.getAttribute("name") || "",
                      id: el.id || "",
                      placeholder: el.getAttribute("placeholder") || "",
                      aria: el.getAttribute("aria-label") || ""
                    }))
                  );

                  const candidate = visibleInputs.find((x) =>
                    !["checkbox","radio","submit","button"].includes(x.type) &&
                    /wallet|address|ethereum|0x/i.test([x.name,x.id,x.placeholder,x.aria].join(" "))
                  ) || visibleInputs.find((x) =>
                    !["checkbox","radio","submit","button"].includes(x.type)
                  );

                  if (!candidate) throw new Error("no visible wallet-address input found");

                  let locator;
                  if (candidate.id) locator = page.locator("#" + CSS.escape(candidate.id));
                  else if (candidate.name) locator = page.locator(`input[name="${candidate.name}"]`);
                  else locator = page.locator("input:visible").first();

                  await locator.fill(address);
                  await page.waitForTimeout(1500);

                  const buttons = page.locator("button:visible, input[type=submit]:visible");
                  const buttonCount = await buttons.count();
                  const preferred = [];
                  const fallback = [];

                  for (let i = 0; i < buttonCount; i++) {
                    const b = buttons.nth(i);
                    const txt = ((await b.innerText().catch(()=>"")) || (await b.getAttribute("value").catch(()=>"")) || "").trim();
                    if (/connect wallet|sign in|login|logout|menu/i.test(txt)) continue;
                    if (/claim.*(0\.1|0\.01|eth)|request|send|check eligibility|continue|verify/i.test(txt)) preferred.push(b);
                    else if (/claim/i.test(txt)) fallback.push(b);
                  }

                  const candidates = [...preferred, ...fallback];
                  if (!candidates.length) throw new Error("no normal claim or verification button found");

                  let clicked = false;
                  for (const b of candidates) {
                    try {
                      await b.click({ timeout: 15000 });
                      clicked = true;
                      break;
                    } catch {}
                  }
                  if (!clicked) throw new Error("claim or verification button could not be clicked");

                  await page.waitForTimeout(8000);
                  try { await page.waitForLoadState("networkidle", { timeout: 10000 }); } catch {}

                  bodyText = await page.locator("body").innerText();
                  fs.writeFileSync(
                    process.env.RUNNER_TEMP + "/sep_faucet_result.txt",
                    "URL=" + url + "\n" + bodyText.slice(0, 50000)
                  );

                  if (/captcha|turnstile|recaptcha|cloudflare challenge|verify you are human/i.test(bodyText)) {
                    throw new Error("interactive anti-bot challenge appeared; no bypass attempted");
                  }

                  const html = await page.content();
                  const hashes = [
                    ...responseHashes,
                    ...(bodyText.match(/0x[a-fA-F0-9]{64}/g) || []),
                    ...(html.match(/0x[a-fA-F0-9]{64}/g) || [])
                  ];

                  console.log("sep_faucet_submitted=true");
                  console.log("sep_faucet_url=" + url);
                  if (hashes.length) console.log("sep_faucet_tx_hash=" + hashes[0]);

                  await page.close();
                  lastError = "";
                  break;
                } catch (e) {
                  lastError = `${url}: ${e.message}`;
                  await page.close().catch(()=>{});
                }
              }
            } finally {
              await browser.close();
            }

            if (lastError) throw new Error(lastError);
          })().catch((error) => { console.error(error); process.exit(1); });
          JS

          NODE_PATH="$RUNNER_TEMP/nova-playwright/node_modules" node "$RUNNER_TEMP/claim_sep_eth.cjs"

          FUNDED=0
          for i in $(seq 1 36); do
            BAL="$(cast balance "$DEPLOYER_ADDRESS" --rpc-url "$SEPOLIA_RPC_URL" --ether)"
            echo "deployer_balance_eth=$BAL"
            if python - "$BAL" <<'PY'
          from decimal import Decimal
          import sys
          raise SystemExit(0 if Decimal(sys.argv[1]) > 0 else 1)
          PY
            then
              FUNDED=1
              break
            fi
            sleep 10
          done

          if [ "$FUNDED" -ne 1 ]; then
            echo "Public Sepolia faucets did not deliver ETH to the disposable deployer"
            exit 1
          fi
          echo "sepolia_funding_confirmed=true"

      - name: Require latest Boss branch head before broadcast
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='boss-nova-sepolia-final-20260921'
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$REMOTE_HEAD" = "${GITHUB_SHA}"
          echo "latest_branch_head_before_broadcast_confirmed"

      - name: Deploy NovaToken
        shell: bash
        run: |
          set -euo pipefail
          NOVA_DEPLOYER_PRIVATE_KEY="0x$(cat "$RUNNER_TEMP/nova_deployer_key")" NOVA_OWNER="$NOVA_OWNER" NOVA_MAX_SUPPLY_TOKENS="$NOVA_MAX_SUPPLY_TOKENS" \
            forge script nova-economy/script/DeployNovaToken.s.sol:DeployNovaToken --rpc-url "$SEPOLIA_RPC_URL" --broadcast
          rm -f "$RUNNER_TEMP/nova_deployer_key"

      - name: Extract and verify on-chain deployment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("nova-economy/broadcast/DeployNovaToken.s.sol/11155111/run-latest.json")
          d=json.loads(p.read_text())
          txs=d.get("transactions", [])
          deployed=[x for x in txs if x.get("transactionType")=="CREATE" and x.get("contractName")=="NovaToken"]
          if not deployed:
              raise SystemExit("NovaToken CREATE transaction not found")
          tx=deployed[-1]
          addr=tx.get("contractAddress")
          tx_hash=tx.get("hash") or tx.get("transactionHash") or tx.get("txHash")
          if not addr or not tx_hash:
              raise SystemExit("contract address or tx hash missing")
          block=tx.get("blockNumber")
          Path("nova-economy/deployment-address.txt").write_text(addr+"\\n")
          metadata={
              "network":"sepolia",
              "chainId":11155111,
              "owner":os.environ["NOVA_OWNER"],
              "maxSupplyTokens":int(os.environ["NOVA_MAX_SUPPLY_TOKENS"]),
              "contractAddress":addr,
              "transactionHash":tx_hash,
              "blockNumber":block
          }
          Path("nova-economy/deployment-sepolia.json").write_text(json.dumps(metadata,indent=2)+"\\n")
          print(json.dumps(metadata))
          PY

          ADDR="$(cat nova-economy/deployment-address.txt)"
          ONCHAIN_OWNER="$(cast call "$ADDR" "owner()(address)" --rpc-url "$SEPOLIA_RPC_URL")"
          ONCHAIN_CAP="$(cast call "$ADDR" "maxSupply()(uint256)" --rpc-url "$SEPOLIA_RPC_URL")"
          ONCHAIN_SUPPLY="$(cast call "$ADDR" "totalSupply()(uint256)" --rpc-url "$SEPOLIA_RPC_URL")"
          export ONCHAIN_OWNER ONCHAIN_CAP ONCHAIN_SUPPLY
          python - <<'PY'
          import os
          from pathlib import Path
          expected_owner=os.environ["NOVA_OWNER"].lower()
          owner=os.environ["ONCHAIN_OWNER"].lower()
          cap=int(os.environ["ONCHAIN_CAP"])
          supply=int(os.environ["ONCHAIN_SUPPLY"])
          expected=int(os.environ["NOVA_MAX_SUPPLY_TOKENS"])*10**18
          assert owner==expected_owner, (owner,expected_owner)
          assert cap==expected, (cap,expected)
          assert supply==0, supply
          Path("nova-economy/deployment-verification.txt").write_text(
              f"owner={os.environ['ONCHAIN_OWNER']}\\n"
              f"maxSupplyWei={os.environ['ONCHAIN_CAP']}\\n"
              f"totalSupplyWei={os.environ['ONCHAIN_SUPPLY']}\\n"
          )
          print("onchain_verification_pass")
          PY

      - name: Commit verified deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Boss/Nova Deployment Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nova-economy/deployment-address.txt nova-economy/deployment-sepolia.json nova-economy/deployment-verification.txt
          git commit -m "Record verified NOVA Sepolia deployment"
          git push origin HEAD:boss-nova-sepolia-final-20260921
