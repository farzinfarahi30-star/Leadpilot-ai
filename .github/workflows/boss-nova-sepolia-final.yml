name: Boss Nova Sepolia Ephemeral Deployment

on:
  push:
    branches:
      - boss-nova-sepolia-final-20260921
    paths-ignore:
      - "nova-economy/deployment-address.txt"
      - "nova-economy/deployment-sepolia.json"
      - "nova-economy/deployment-verification.txt"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NOVA_OWNER: "0x63970A951bd69975eF2aDAD27bf73584D2DCeF9B"
      NOVA_MAX_SUPPLY_TOKENS: "1000000"
      SEPOLIA_RPC_URL: "https://ethereum-sepolia-rpc.publicnode.com"



    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Require latest Boss branch head
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='boss-nova-sepolia-final-20260921'
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$REMOTE_HEAD" = "${GITHUB_SHA}"
          echo "latest_branch_head_confirmed"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NOVA_OWNER" =~ ^0x[0-9a-fA-F]{40}$ ]]
          python - <<'PY'
          import os
          cap=int(os.environ["NOVA_MAX_SUPPLY_TOKENS"])
          assert cap > 0
          print("configuration_valid")
          PY

      - name: Install Solidity dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: Format, test, build
        run: |
          forge fmt --check
          forge test -vv
          forge build

      - name: Generate disposable Sepolia deployer
        id: key
        shell: bash
        run: |
          set -euo pipefail
          KEY="0x$(openssl rand -hex 32)"
          ADDR="$(cast wallet address --private-key "$KEY")"
          echo "deployer_address=$ADDR" >> "$GITHUB_OUTPUT"
          printf '%s' "$KEY" > "$RUNNER_TEMP/nova_deployer_key"
          chmod 600 "$RUNNER_TEMP/nova_deployer_key"
          unset KEY

      - name: Validate disposable deployer address
        env:
          DEPLOYER_ADDRESS: ${{ steps.key.outputs.deployer_address }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYER_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]
          echo "deployer_address_format_valid"

      - name: Fund disposable deployer through QuickNode Sepolia faucet
        env:
          DEPLOYER_ADDRESS: ${{ steps.key.outputs.deployer_address }}
        run: |
          set -euo pipefail
          COOKIE_JAR="$RUNNER_TEMP/nova_quicknode_cookies"
          STEP_ONE="$RUNNER_TEMP/nova_quicknode_step_one.html"
          STEP_TWO="$RUNNER_TEMP/nova_quicknode_step_two.html"

          curl -fsS -c "$COOKIE_JAR" -b "$COOKIE_JAR" -L \
            -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -H 'Referer: https://faucet.quicknode.com/ethereum/sepolia' \
            --data-urlencode "wallet=$DEPLOYER_ADDRESS" \
            --data-urlencode 'chain=ethereum' \
            --data-urlencode 'network=sepolia' \
            --data-urlencode '_action=step-one' \
            'https://faucet.quicknode.com/ethereum/sepolia' > "$STEP_ONE"

          python - "$STEP_ONE" "$STEP_TWO" "$DEPLOYER_ADDRESS" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlencode
          import sys

          src=Path(sys.argv[1]).read_text(errors='replace')
          out=Path(sys.argv[2])
          address=sys.argv[3]

          class FormParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms=[]; self.form=None; self.select=None; self.button=None
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='form':
                      self.form={'action':a.get('action') or '/ethereum/sepolia','inputs':[],'buttons':[],'selects':[]}
                      self.forms.append(self.form)
                  elif self.form and tag=='input':
                      self.form['inputs'].append(a)
                  elif self.form and tag=='select':
                      self.select={'attrs':a,'options':[]}; self.form['selects'].append(self.select)
                  elif self.form and tag=='option' and self.select is not None:
                      self.select['options'].append(a)
                  elif self.form and tag=='button' and a.get('type','submit')=='submit':
                      self.form['buttons'].append(a)
              def handle_endtag(self, tag):
                  if tag=='select': self.select=None
                  elif tag=='form': self.form=None; self.select=None

          p=FormParser(); p.feed(src)
          if not p.forms:
              raise SystemExit('QuickNode step-one returned no form')
          f=max(p.forms, key=lambda x: len(x['inputs'])+len(x['selects'])+len(x['buttons']))
          params={}
          blockers=[]
          for a in f['inputs']:
              name=a.get('name')
              if not name: continue
              typ=a.get('type','text').lower()
              value=a.get('value','')
              if typ in {'checkbox','radio'} and 'checked' not in a: continue
              if name in {'wallet','address'}: value=address
              if not value and any(k in name.lower() for k in ('captcha','turnstile','recaptcha')): blockers.append(name)
              params[name]=value
          for s in f['selects']:
              name=s['attrs'].get('name')
              if not name or not s['options']: continue
              opts=[o for o in s['options'] if 'disabled' not in o and o.get('value')]

              if not opts: continue

              chosen=opts[0].get('value','')

              if 'amount' in name.lower():

                  numeric=[]

                  for o in opts:

                      try: numeric.append((float(o.get('value')),o.get('value')))

                      except: pass

                  if numeric: chosen=min(numeric)[1]

              params[name]=chosen
          for b in f['buttons']:

              name=b.get('name'); value=b.get('value','')

              if name and name not in params and value: params[name]=value; break
          if not any(k in params for k in ('_action','action')) and f['buttons']:

              b=f['buttons'][0];

              if b.get('name') and b.get('value'): params[b['name']]=b['value']

          Path(out).write_text(urlencode(params))
          print('quicknode_form_action='+f['action'])
          print('quicknode_form_fields='+','.join(sorted(params)))
          if blockers:

              raise SystemExit('QuickNode form requires interactive bot verification: '+','.join(blockers))
          if not any(k in params for k in ('_action','action')):

              raise SystemExit('QuickNode form exposes no submit action')
          PY

          curl -fsS -c "$COOKIE_JAR" -b "$COOKIE_JAR" -L \
            -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -H 'Referer: https://faucet.quicknode.com/ethereum/sepolia' \
            --data-binary "$(cat "$STEP_TWO")" \
            'https://faucet.quicknode.com/ethereum/sepolia' > "$STEP_TWO.response"

          if grep -Eqi 'captcha|turnstile|recaptcha|bot verification|invalid request|error' "$STEP_TWO.response"; then
            echo "QuickNode returned a verification/error response; no bypass attempted."
            grep -Eio 'captcha[^<]{0,120}|turnstile[^<]{0,120}|recaptcha[^<]{0,120}|invalid request|bot verification|error[^<]{0,120}' "$STEP_TWO.response" | head -30 || true
          fi

          for i in $(seq 1 36); do
            BAL="$(cast balance "$DEPLOYER_ADDRESS" --rpc-url "$SEPOLIA_RPC_URL" --ether)"
            echo "deployer_balance_eth=$BAL"
            python - "$BAL" <<'PY'
          import sys
          from decimal import Decimal
          if Decimal(sys.argv[1]) > 0:
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            sleep 10
          done

          echo "QuickNode Sepolia faucet did not deliver ETH to the disposable deployer"
          exit 1
      - name: Deploy NovaToken
        shell: bash
        run: |
          set -euo pipefail
          NOVA_DEPLOYER_PRIVATE_KEY="0x$(cat "$RUNNER_TEMP/nova_deployer_key")" NOVA_OWNER="$NOVA_OWNER" NOVA_MAX_SUPPLY_TOKENS="$NOVA_MAX_SUPPLY_TOKENS" \
            forge script nova-economy/script/DeployNovaToken.s.sol:DeployNovaToken --rpc-url "$SEPOLIA_RPC_URL" --broadcast
          rm -f "$RUNNER_TEMP/nova_deployer_key"

      - name: Extract and verify on-chain deployment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("nova-economy/broadcast/DeployNovaToken.s.sol/11155111/run-latest.json")
          d=json.loads(p.read_text())
          txs=d.get("transactions", [])
          deployed=[x for x in txs if x.get("transactionType")=="CREATE" and x.get("contractName")=="NovaToken"]
          if not deployed:
              raise SystemExit("NovaToken CREATE transaction not found")
          tx=deployed[-1]
          addr=tx.get("contractAddress")
          tx_hash=tx.get("hash") or tx.get("transactionHash") or tx.get("txHash")
          if not addr or not tx_hash:
              raise SystemExit("contract address or tx hash missing")
          block=tx.get("blockNumber")
          Path("nova-economy/deployment-address.txt").write_text(addr+"\\n")
          metadata={
              "network":"sepolia",
              "chainId":11155111,
              "owner":os.environ["NOVA_OWNER"],
              "maxSupplyTokens":int(os.environ["NOVA_MAX_SUPPLY_TOKENS"]),
              "contractAddress":addr,
              "transactionHash":tx_hash,
              "blockNumber":block
          }
          Path("nova-economy/deployment-sepolia.json").write_text(json.dumps(metadata,indent=2)+"\\n")
          print(json.dumps(metadata))
          PY

          ADDR="$(cat nova-economy/deployment-address.txt)"
          ONCHAIN_OWNER="$(cast call "$ADDR" "owner()(address)" --rpc-url "$SEPOLIA_RPC_URL")"
          ONCHAIN_CAP="$(cast call "$ADDR" "maxSupply()(uint256)" --rpc-url "$SEPOLIA_RPC_URL")"
          ONCHAIN_SUPPLY="$(cast call "$ADDR" "totalSupply()(uint256)" --rpc-url "$SEPOLIA_RPC_URL")"
          export ONCHAIN_OWNER ONCHAIN_CAP ONCHAIN_SUPPLY
          python - <<'PY'
          import os
          from pathlib import Path
          expected_owner=os.environ["NOVA_OWNER"].lower()
          owner=os.environ["ONCHAIN_OWNER"].lower()
          cap=int(os.environ["ONCHAIN_CAP"])
          supply=int(os.environ["ONCHAIN_SUPPLY"])
          expected=int(os.environ["NOVA_MAX_SUPPLY_TOKENS"])*10**18
          assert owner==expected_owner, (owner,expected_owner)
          assert cap==expected, (cap,expected)
          assert supply==0, supply
          Path("nova-economy/deployment-verification.txt").write_text(
              f"owner={os.environ['ONCHAIN_OWNER']}\\n"
              f"maxSupplyWei={os.environ['ONCHAIN_CAP']}\\n"
              f"totalSupplyWei={os.environ['ONCHAIN_SUPPLY']}\\n"
          )
          print("onchain_verification_pass")
          PY

      - name: Commit verified deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Boss/Nova Deployment Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nova-economy/deployment-address.txt nova-economy/deployment-sepolia.json nova-economy/deployment-verification.txt
          git commit -m "Record verified NOVA Sepolia deployment"
          git push origin HEAD:boss-nova-sepolia-final-20260921
